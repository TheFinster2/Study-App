<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16223f"/>
      <stop offset="55%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39d6c8"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.5">
      <stop offset="0%" stop-color="#39d6c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39d6c8" stop-opacity="0"/>
    </radialGradient>
    <path id="flask" d="M216,124 V198 L142,352 c-14,30 8,64 41,64 h146 c33,0 55,-34 41,-64 L296,198 V124 Z"/>
    <clipPath id="inside"><use href="#flask"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="368" r="190" fill="url(#glow)"/>

  <!-- liquid, clipped to the flask body -->
  <g clip-path="url(#inside)">
    <rect x="120" y="300" width="272" height="130" fill="url(#liquid)"/>
    <circle cx="196" cy="316" r="13" fill="#eef3ff" opacity=".5"/>
    <circle cx="248" cy="296" r="9"  fill="#eef3ff" opacity=".4"/>
    <circle cx="300" cy="322" r="11" fill="#eef3ff" opacity=".45"/>
  </g>

  <!-- glassware outline -->
  <use href="#flask" fill="none" stroke="#eef3ff" stroke-width="19" stroke-linejoin="round"/>
  <rect x="200" y="96" width="112" height="30" rx="15" fill="#eef3ff"/>

  <!-- rising bubbles -->
  <circle cx="256" cy="176" r="10" fill="#39d6c8" opacity=".85"/>
  <circle cx="292" cy="140" r="7"  fill="#7c5cff" opacity=".8"/>
  <circle cx="222" cy="150" r="6"  fill="#39d6c8" opacity=".6"/>
</svg>
